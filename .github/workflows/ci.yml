name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: pip install -r requirements-dev.txt
      # TODO: widen to all of app/ once the older extraction modules are ruff-clean.
      - run: ruff check app/main.py app/config.py app/security.py app/chat app/bundle app/rag/indexer.py tests
      - run: python -m pytest -q tests
