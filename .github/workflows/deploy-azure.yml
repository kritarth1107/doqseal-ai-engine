# Deploys AI engine to Azure Container Apps via OIDC (AZURE_* repo secrets).
# CPU image (Dockerfile) — vision extraction uses Azure OpenAI GPT-4o.
# RAG indexing stays on Qdrant + local embeddings.
name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: doqsealprodacr
  RESOURCE_GROUP: doqseal-prod-rg
  CONTAINER_APP_NAME: doqseal-prod-ai-engine
  IMAGE_NAME: doqseal-ai-engine
  WORKLOAD_PROFILE: Consumption
  KEY_VAULT_NAME: doqseal-prod-kv

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push CPU image to ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --image "${IMAGE_NAME}:latest" \
            --file Dockerfile \
            . \
            --no-logs

      - name: Wire Azure OpenAI secrets from Key Vault
        run: |
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              azure-openai-endpoint=keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/AZURE-OPENAI-ENDPOINT,identityref:system \
              azure-openai-api-key=keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/AZURE-OPENAI-API-KEY,identityref:system \
              azure-openai-deployment=keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/AZURE-OPENAI-DEPLOYMENT,identityref:system \
              azure-openai-api-version=keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/AZURE-OPENAI-API-VERSION,identityref:system

      - name: Deploy Container App (CPU Consumption)
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" \
            --workload-profile-name "$WORKLOAD_PROFILE" \
            --cpu 2.0 \
            --memory 4Gi \
            --min-replicas 1 \
            --max-replicas 3 \
            --set-env-vars \
              "GIT_SHA=${GITHUB_SHA}" \
              "VLM_PROVIDER=azure_openai" \
              "AZURE_OPENAI_ENDPOINT=secretref:azure-openai-endpoint" \
              "AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key" \
              "AZURE_OPENAI_DEPLOYMENT=secretref:azure-openai-deployment" \
              "AZURE_OPENAI_API_VERSION=secretref:azure-openai-api-version" \
              "SKIP_OCR_FOR_VISION=true" \
              "EXTRACTION_MODE=hybrid" \
              "WARMUP_VLM=false" \
              "WARMUP_MODELS=true"
